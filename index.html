<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deures">
<meta name="description" content="Deberes, exámenes, horario y calendario personal.">
<title>Deures · Agenda de clase</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#0D0F14; --bg-surface:#151922; --bg-elevated:#1C212C; --bg-hover:#242A37;
  --border:#262D3B; --border-strong:#343C4D;
  --text:#E9ECF2; --text-2:#9AA3B5; --text-3:#646D80; --on-accent:#fff;
  --accent:#7C6CFF; --accent-soft:rgba(124,108,255,.16);
  --personal:#2EC4B6; --personal-soft:rgba(46,196,182,.16);
  --success:#3DD68C; --success-soft:rgba(61,214,140,.16);
  --warning:#FFB547; --warning-soft:rgba(255,181,71,.16);
  --danger:#FF5C6C; --danger-soft:rgba(255,92,108,.16);
  --radius:12px; --radius-lg:16px;
  --sidebar:248px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-app);color:var(--text);font:14px/1.4 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea,select{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input[type=date],input[type=time]{color-scheme:dark}
select{appearance:none;-webkit-appearance:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s14{width:14px;height:14px} svg.i.s16{width:16px;height:16px} svg.i.s18{width:18px;height:18px} svg.i.s24{width:24px;height:24px}
.muted{color:var(--text-3)} .sec{color:var(--text-2)}
.cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.hide{display:none!important}

/* ---------- app shell ---------- */
#app{display:flex;height:100%}
.sidebar{width:var(--sidebar);flex:none;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px 20px;gap:2px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.logo b{font-size:17px;display:block;line-height:1.2}
.logo small{font-size:11px;color:var(--text-3)}
.nav-cap{padding:12px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:500;width:100%;text-align:left;text-decoration:none}
.nav:hover{background:var(--bg-hover);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav.on svg{color:var(--accent)}
.nav.pers.on{background:var(--personal-soft)} .nav.pers.on svg{color:var(--personal)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-elevated);border-radius:999px;padding:1px 7px}
.sync{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg-elevated);margin-top:auto;margin-bottom:4px}
.sync b{font-size:12px;display:block} .sync small{font-size:11px;color:var(--text-3)}
.sync.ok svg{color:var(--success)} .sync.warn svg{color:var(--warning)} .sync.load svg{color:var(--text-3)}
main{flex:1;min-width:0;overflow-y:auto;padding:32px 40px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:26px;letter-spacing:-.015em;font-weight:700}
.head p{color:var(--text-2);margin-top:4px}
.head .acts{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;width:260px;height:40px;padding:0 12px;border-radius:10px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-3)}
.search input{border:0;background:none;padding:0;height:100%;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px 10px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.pers{background:var(--personal);color:#06201d}
.btn.ghost{background:none;border:1px solid var(--border-strong);color:var(--text-2);font-weight:500}
.btn.ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn.danger{background:none;border:1px solid var(--border-strong);color:var(--danger);font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px}
.link{color:var(--accent);font-weight:500;font-size:13px;text-decoration:none}
.link:hover{text-decoration:underline}
.exam .info .chip,.detail>.chip,.sheet>.chip{align-self:flex-start}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:15px;font-weight:600}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{color:var(--text-3);font-size:13px;padding:6px 0}
.empty-big{text-align:center;padding:48px 20px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-big svg{width:40px;height:40px;color:var(--text-3)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;text-align:left}
.stat span{font-size:13px;color:var(--text-2);font-weight:500}
.stat b{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.stat small{font-size:12px;color:var(--text-3)}

/* chip */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--bg-elevated);font-size:12px;font-weight:500;color:var(--text-2);max-width:220px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,#888)}
.chip em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
button.chip{border:1px solid transparent}
button.chip:hover{color:var(--text)}
button.chip.on{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c);color:var(--text)}
.pill-f{padding:5px 12px;border-radius:999px;background:var(--bg-elevated);font-size:12px;font-weight:500;color:var(--text-2)}
.pill-f.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* segmented */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg-elevated)}
.seg.box{background:var(--bg-surface);border:1px solid var(--border);padding:4px}
.seg button{padding:6px 14px;border-radius:7px;color:var(--text-2);font-weight:500;font-size:13px;flex:1;white-space:nowrap}
.seg button.on{background:var(--bg-hover);color:var(--text);font-weight:600}
.seg button.on.alta{background:var(--danger-soft);color:var(--danger)}
.seg button.on.media{background:var(--warning-soft);color:var(--warning)}
.seg button.on.baja{background:var(--bg-hover);color:var(--text)}
.seg button.on.acc{background:var(--accent-soft);color:var(--text)}
.seg button.on.pers{background:var(--personal-soft);color:var(--personal)}
.seg.full{display:flex;width:100%}

/* task row */
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:var(--bg-surface);border:1px solid var(--border);cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--border-strong)}
.task.sel{border-color:var(--accent);box-shadow:0 0 0 .5px var(--accent)}
.task.done{opacity:.7}
.task.done .t-title{color:var(--text-3);text-decoration:line-through}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-3);flex:none;display:grid;place-items:center;color:var(--bg-app)}
.cb:hover{border-color:var(--success)}
.cb.on{background:var(--success);border-color:var(--success)}
.cb.on svg{stroke-width:3}
.cb.sm{width:18px;height:18px;border-radius:5px}
.t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.t-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-2);min-width:0;flex-wrap:wrap;row-gap:4px}
.t-meta .m{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.t-meta .m svg{color:var(--text-3)}
.t-meta .over{color:var(--danger)}
.t-meta .m.st{color:var(--text-3)}
.kind{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.kind.examen{background:var(--danger-soft);color:var(--danger)}
.kind.personal{background:var(--personal-soft);color:var(--personal)}
.kind.deber{background:var(--bg-elevated);color:var(--text-2)}
.flag{color:var(--text-3)} .flag.alta{color:var(--danger)} .flag.media{color:var(--warning)}
.group{display:flex;flex-direction:column;gap:10px}
.group .cap{margin-top:6px}
.group .cap.red{color:var(--danger)}

/* hoy */
.cols{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.cls{display:flex;gap:12px;padding:8px;border-radius:10px;align-items:stretch}
.cls.now{background:var(--accent-soft)}
.cls .tm{width:42px;flex:none;display:flex;flex-direction:column;gap:2px}
.cls .tm b{font-size:13px} .cls .tm small{font-size:12px;color:var(--text-3)}
.cls .bar{width:3px;border-radius:2px;background:var(--c);flex:none}
.cls .inf{display:flex;flex-direction:column;gap:3px;min-width:0}
.cls .inf b{font-weight:500;display:flex;align-items:center;gap:8px}
.cls .inf small{font-size:12px;color:var(--text-3)}
.now-b{font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:5px;padding:2px 6px}
.pers-row{display:flex;align-items:center;gap:10px;font-size:13px}
.pers-row i{width:8px;height:8px;border-radius:50%;background:var(--personal);flex:none}
.pers-row small{color:var(--text-3);font-weight:500;font-size:12px}
.mob-now{display:none}

/* exam card */
.grid-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.exam{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:16px;cursor:pointer;text-align:left;width:100%}
.exam:hover{border-color:var(--border-strong)}
.exam .top{display:flex;gap:14px;align-items:center}
.cd{width:64px;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.cd b{font-size:26px;line-height:1;letter-spacing:-.02em} .cd small{font-size:11px;font-weight:500}
.cd.d{background:var(--danger-soft);color:var(--danger)} .cd.w{background:var(--warning-soft);color:var(--warning)}
.cd b.sm{font-size:16px}
.exam .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.exam .info b{font-size:15px;font-weight:600}
.exam .date{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:500}
.exam .date svg{color:var(--text-3)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:500}
.track{height:6px;border-radius:3px;background:var(--bg-elevated);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.track.ok i{background:var(--success)}
.past{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px 0}
.past button{display:flex;align-items:center;gap:16px;padding:14px 20px;width:100%;text-align:left;border-bottom:1px solid var(--border)}
.past button:last-child{border-bottom:0}
.past button:hover{background:var(--bg-hover)}
.past .t{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.past .d{width:90px;color:var(--text-3);font-size:13px}
.grade{min-width:44px;text-align:center;border-radius:8px;padding:4px 10px;font-weight:700;background:var(--bg-elevated);color:var(--text-2)}
.grade.ok{background:var(--success-soft);color:var(--success)} .grade.mid{background:var(--warning-soft);color:var(--warning)} .grade.bad{background:var(--danger-soft);color:var(--danger)}

/* deberes layout */
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.filters{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.split{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start;flex:1;min-height:0}
.list{display:flex;flex-direction:column;gap:10px}
.detail{position:sticky;top:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 64px);overflow-y:auto}
.detail h2{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prop{display:flex;align-items:center;gap:12px;font-size:13px}
.prop>span:first-child{width:84px;color:var(--text-3);flex:none}
.notes{width:100%;background:var(--bg-elevated);border:1px solid transparent;border-radius:10px;padding:12px 14px;color:var(--text-2);font-size:13px;line-height:1.5;min-height:80px}
.notes:focus{border-color:var(--accent);color:var(--text)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-size:13px}
.step.done span{color:var(--text-3);text-decoration:line-through}
.step span{flex:1}
.step .x{opacity:0;color:var(--text-3);padding:2px}
.step:hover .x{opacity:1}
.add-step{display:flex;align-items:center;gap:10px;color:var(--accent)}
.add-step input{background:none;border:0;padding:4px 0;color:var(--text);font-size:13px}
.add-step input::placeholder{color:var(--accent);font-weight:500}
.d-acts{display:flex;gap:10px;margin-top:auto}
.d-acts .btn:first-child{flex:1}

/* calendar */
.legend{display:flex;gap:18px;font-size:12px;color:var(--text-2);font-weight:500;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:24px;flex:1;min-height:560px}
.month{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:grid;grid-template-rows:auto repeat(6,1fr);overflow:hidden}
.wd,.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.wd span{padding:10px 12px}
.day{border-top:1px solid var(--border);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:96px;text-align:left;cursor:pointer}
.wk .day:last-child{border-right:0}
.day:hover{background:var(--bg-hover)}
.day.out{opacity:.45}
.day.sel{background:var(--bg-elevated)}
.day .n{font-size:12px;font-weight:500;color:var(--text-2);width:24px;height:24px;display:grid;place-items:center;border-radius:12px}
.day.sel .n{color:var(--text);font-weight:700}
.day.today .n{background:var(--accent);color:#fff;font-weight:700}
.day .more{font-size:11px;color:var(--text-3);padding-left:4px}
.dots{display:none}
.ev{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;font-size:11px;font-weight:500;background:color-mix(in srgb,var(--c) 18%,transparent);min-width:0;white-space:nowrap}
.ev::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--c);flex:none}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.5;text-decoration:line-through}
.daypanel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
.daypanel h3{font-size:18px;font-weight:600}
.dp-item{display:flex;gap:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);text-align:left;width:100%}
.dp-item .bar{width:3px;border-radius:2px;background:var(--c);flex:none}
.dp-item b{font-weight:600;display:block}
.dp-item small{font-size:12px;color:var(--text-2)}
.dp-item.done b{text-decoration:line-through;color:var(--text-3)}
.add-day{border:1px dashed var(--border-strong);border-radius:10px;padding:10px;color:var(--text-2);font-weight:500;margin-top:auto}
.add-day:hover{color:var(--text);border-color:var(--text-3)}
.switch{display:inline-flex;align-items:center;gap:10px;color:var(--text-2);font-weight:500;font-size:13px}
.switch i{width:36px;height:20px;border-radius:10px;background:var(--bg-hover);position:relative;transition:.15s}
.switch i::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--personal)} .switch.on i::after{left:18px}
.mnav{display:flex;align-items:center;gap:4px;padding:4px;border-radius:10px;background:var(--bg-surface);border:1px solid var(--border)}
.mnav button{padding:6px;border-radius:7px;color:var(--text-2)} .mnav button:hover{background:var(--bg-hover);color:var(--text)}
.mnav button.t{padding:5px 12px;background:var(--bg-hover);color:var(--text);font-weight:600;font-size:13px}

/* horario */
.week{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);position:relative;overflow:hidden}
.week .hdr{display:grid;grid-template-columns:72px repeat(var(--nd),1fr);border-bottom:1px solid var(--bg-elevated);height:44px;align-items:center}
.week .hdr span{font-size:12px;font-weight:600;color:var(--text-2);padding-left:10px}
.week .hdr span.today{color:var(--accent)}
.week .body{position:relative;display:grid;grid-template-columns:72px repeat(var(--nd),1fr)}
.week .hours{position:relative}
.week .hours span{position:absolute;left:14px;font-size:11px;color:var(--text-3);font-weight:500;transform:translateY(4px)}
.week .col{position:relative;border-left:1px solid var(--bg-elevated);cursor:copy}
.week .line{position:absolute;z-index:0;left:72px;right:0;height:1px;background:var(--bg-elevated);pointer-events:none}
.week .line.half{opacity:.5}
.blk{position:absolute;z-index:1;left:6px;right:6px;border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--c) 16%,var(--bg-surface));border-left:3px solid var(--c);display:flex;flex-direction:column;gap:3px;overflow:hidden;text-align:left;cursor:pointer}
.blk:hover{background:color-mix(in srgb,var(--c) 26%,var(--bg-surface))}
.blk b{font-size:13px;font-weight:600;line-height:1.25}
.blk small{font-size:11px;color:var(--text-2);font-weight:500}
.blk small.r{color:var(--text-3);font-weight:400}
.nowline{position:absolute;height:2px;background:var(--danger);pointer-events:none;z-index:2}
.nowline::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.week-mob{display:none;flex-direction:column;gap:10px}

/* personal */
.pers-wrap{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.mini{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.mini span{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:4px 0}
.mini button{height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500}
.mini button em{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-style:normal}
.mini button:hover em{background:var(--bg-hover)}
.mini button.out{color:var(--text-3)}
.mini button.today em{background:var(--personal);color:var(--bg-app);font-weight:700}
.mini button.sel em{outline:1.5px solid var(--personal)}
.mini button i{width:4px;height:4px;border-radius:2px;background:transparent}
.mini button.has i{background:var(--personal)}
.agenda{display:flex;flex-direction:column;gap:12px}
.ag-h{display:flex;align-items:center;gap:8px;padding-top:4px;font-weight:600}
.ag-h.today{color:var(--personal)}
.ag-h small{font-size:12px;color:var(--text-3);font-weight:400}
.evrow{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--border);text-align:left;width:100%}
.evrow:hover{border-color:var(--border-strong)}
.evrow.past{opacity:.55}
.evrow .tm{width:56px;flex:none;font-weight:600}
.evrow .bar{width:3px;height:36px;border-radius:2px;background:var(--c);flex:none}
.evrow .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.evrow .inf b{font-weight:600}
.evrow .inf small{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.cats{display:flex;flex-wrap:wrap;gap:8px}

/* ajustes */
.set-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.subj-row{display:flex;align-items:center;gap:10px}
.subj-row input{padding:8px 10px}
.colorbtn{width:28px;height:28px;border-radius:8px;background:var(--c);flex:none;border:2px solid rgba(255,255,255,.08)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);flex:none}
.iconbtn:hover{background:var(--bg-hover);color:var(--danger)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.howto{font-size:13px;color:var(--text-2);line-height:1.6}
.howto b{color:var(--text)}
.howto ol{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-size:13px}
.banner.warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 40%,transparent)}
.welcome{background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(46,196,182,.10));border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:16px}
.welcome h2{font-size:22px;letter-spacing:-.01em}
.welcome p{color:var(--text-2);max-width:620px}

/* modal / sheet */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .15s}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto;background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;padding:22px 24px 24px;display:flex;flex-direction:column;gap:16px;animation:pop .15s}
.sheet .handle{display:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{font-size:20px}
.lbl{font-size:12px;font-weight:600;color:var(--text-2)}
.field{display:flex;flex-direction:column;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.quick{display:flex;gap:8px}
.quick button{flex:1;padding:8px 10px;border-radius:10px;background:var(--bg-elevated);color:var(--text-2);font-weight:500;font-size:13px;border:1px solid transparent}
.quick button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.title-in{font-size:16px;font-weight:500;padding:14px}
.err{color:var(--danger);font-size:12px}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--bg-hover);border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s}
.toast button{color:var(--accent);font-weight:600;padding:4px 6px}

/* mobile */
.bottom{display:none}
.fab{display:none}
.mob-head{display:none}
@media (max-width:1180px){
  .cols{grid-template-columns:1fr 320px}
  .split{grid-template-columns:1fr 340px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cal-wrap{grid-template-columns:1fr 260px}
}
@media (max-width:899px){
  body{overflow:auto}
  #app{display:block;height:auto}
  .sidebar{display:none}
  main{overflow:visible;padding:calc(20px + var(--safe-t)) 16px calc(110px + var(--safe-b));gap:18px;min-height:100vh}
  .head h1{font-size:22px}
  .head .search{display:none}
  .head .btn{display:none}
  .mob-head{display:flex}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:12px 14px;border-radius:14px;gap:2px}
  .stat b{font-size:20px} .stat small{display:none} .stat span{order:2;font-size:12px}
  .stat.hide-m{display:none}
  .cols,.split,.cal-wrap,.pers-wrap,.set-wrap{grid-template-columns:1fr}
  .side .cls-card{display:none}
  .mob-now{display:flex}
  .detail-col{display:none}
  .task{padding:12px 14px;gap:12px}
  .t-meta .m.st{display:none}
  .grid-ex{grid-template-columns:1fr}
  .past .d{display:none} .past .chip{display:none}
  .toolbar{gap:10px}
  .toolbar .sort{display:none}
  .seg.box{width:100%} .seg.box button{flex:1}
  .month{grid-template-rows:auto repeat(6,56px)}
  .day{min-height:0;padding:4px;align-items:center;gap:2px}
  .day .ev,.day .more{display:none}
  .dots{display:flex;gap:2px;justify-content:center}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
  .cal-head .switch span{display:none}
  .week-desk{display:none}
  .week-mob{display:flex}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg-surface);border-top:1px solid var(--border);padding:8px 8px calc(8px + var(--safe-b));justify-content:space-around}
  .bottom button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--text-3);width:64px;padding:4px 0}
  .bottom button.on{color:var(--text);font-weight:600} .bottom button.on svg{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + var(--safe-b));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;z-index:41;box-shadow:0 8px 24px rgba(124,108,255,.35)}
  .fab.pers{background:var(--personal);color:#06201d;box-shadow:0 8px 24px rgba(46,196,182,.3)}
  .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + var(--safe-b));animation:up .2s}
  .sheet .handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto}
  .quick button{padding:8px 4px}
  #toast{bottom:calc(150px + var(--safe-b))}
  .welcome{padding:20px}
}

/* ---------- PWA: acceso, avisos, instalar ---------- */
body.authing .sidebar, body.authing .bottom, body.authing .fab{display:none!important}
body.authing main{padding:0}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px calc(24px + var(--safe-b))}
.auth-card{width:min(420px,100%);background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.auth-card h2{font-size:22px;letter-spacing:-.01em;margin-top:6px}
.auth-card .btn{padding:12px 16px}
.btn[disabled]{opacity:.6;cursor:default}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0}
.opt span{display:flex;flex-direction:column;gap:2px}
.opt b{font-size:14px;font-weight:600}
.opt small{font-size:12px;color:var(--text-3);line-height:1.4}
.opt .switch{flex:none}
.switch.on i{background:var(--accent)}
.cal-head .switch.on i{background:var(--personal)}
code.url{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2);background:var(--bg-elevated);padding:8px 10px;border-radius:8px;word-break:break-all}
.howto.err{color:var(--danger)}
@media (display-mode: standalone){ .sidebar{padding-top:calc(24px + var(--safe-t))} }

/* ---------- Classroom / Moodle ---------- */
.src{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.src.gc{background:rgba(61,214,140,.14);color:#3DD68C}
.src.md{background:rgba(255,138,76,.14);color:#FF8A4C}
.intg{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--bg-elevated)}
.intg-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.intg input{padding:8px 10px;font-size:13px}

</style>
</head>

const num=(v,d=0)=>typeof v==='number'&&isFinite(v)?v:d;

/* --- persistencia en el dispositivo --- */
const kCache=()=>'deures:cache:'+(S.user?S.user.id:'x');
const kOut=()=>'deures:outbox:'+(S.user?S.user.id:'x');
function persistLocal(){
  const snap={settings:S.settings,items:S.items};
  if(S.mode==='cloud'){ LS.set(kCache(),snap); LS.set(kOut(),OUT); }
  else if(S.mode==='local') LS.set(K_LOCAL,snap);
}
let persistT=null; const persistSoon=()=>{clearTimeout(persistT);persistT=setTimeout(persistLocal,250);};
function loadSnap(snap){
  S.settings=cleanSettings(snap&&snap.settings); S.items={};
  if(snap&&snap.items) for(const [id,r] of Object.entries(snap.items)){ const it=cleanItem(r,id); if(it) S.items[it.id]=it; }
  applySettingsLang();
}
function applySettingsLang(){ if(S.settings.lang&&S.settings.lang!==LANG){ setLang(S.settings.lang); } }

/* --- API de guardado (optimista) --- */
function saveItem(it){
  it={...it,updatedAt:Date.now()}; S.items[it.id]=it; render();
  if(S.mode==='cloud'){ OUT.items[it.id]=it; flushSoon(); }
  persistSoon();
}
function removeItem(id){
  const it=S.items[id]; if(!it) return;
  if(S.mode==='cloud') saveItem({...it,deleted:true});
  else { delete S.items[id]; render(); persistSoon(); }
}
function saveSettings(patch){
  S.settings={...S.settings,...patch,updatedAt:Date.now()}; render();
  if(S.mode==='cloud'){ OUT.settings=S.settings; flushSoon(); }
  persistSoon();
}

/* ================= SUPABASE ================= */
const SB={client:null,channel:null,gen:0,retryT:null,flushT:null,flushing:false,backoff:2000};
function flushSoon(ms=400){ clearTimeout(SB.flushT); SB.flushT=setTimeout(flush,ms); }
async function flush(){
  if(S.mode!=='cloud'||!S.user||SB.flushing) return;
  const ids=Object.keys(OUT.items);
  if(!ids.length&&!OUT.settings){ S.pending=0; return; }
  SB.flushing=true;
  try{
    if(OUT.settings){
      const snap=OUT.settings;
      const {error}=await SB.client.from('settings').upsert({user_id:S.user.id,data:snap,updated_at:new Date(snap.updatedAt||Date.now()).toISOString()});
      if(error) throw error;
      if(OUT.settings===snap) OUT.settings=null;
    }
    for(let i=0;i<ids.length;i+=200){
      const chunk=ids.slice(i,i+200).filter(id=>OUT.items[id]).map(id=>{const it=OUT.items[id];return {id,user_id:S.user.id,data:it,updated_at:new Date(it.updatedAt).toISOString()};});
      if(!chunk.length) continue;
      const {error}=await SB.client.from('items').upsert(chunk);
      if(error) throw error;
      for(const r of chunk){ const cur=OUT.items[r.id]; if(cur&&cur.updatedAt===r.data.updatedAt) delete OUT.items[r.id]; }
    }
    S.syncErr=null; S.lastSync=Date.now(); SB.backoff=2000;
  }catch(e){
    S.syncErr=(e&&e.message)||'error'; SB.backoff=Math.min(SB.backoff*2,60000); flushSoon(SB.backoff);
  }finally{
    SB.flushing=false; S.pending=Object.keys(OUT.items).length+(OUT.settings?1:0); persistSoon(); render();
    if(S.pending&&!S.syncErr) flushSoon(50);
  }
}
async function fetchAll(){
  if(S.mode!=='cloud'||!S.user) return;
  const uidv=S.user.id;
  const st=await SB.client.from('settings').select('data,updated_at').eq('user_id',uidv).maybeSingle();
  if(st.error) throw st.error;
  const rows=[]; for(let from=0;;from+=1000){ const r=await SB.client.from('items').select('id,data,updated_at').eq('user_id',uidv).range(from,from+999); if(r.error) throw r.error; rows.push(...(r.data||[])); if(!r.data||r.data.length<1000) break; }
  if(!S.user||S.user.id!==uidv) return;
  if(!OUT.settings){
    if(st.data&&st.data.data){ S.settings=cleanSettings(st.data.data); applySettingsLang(); }
    else if(S.settings.updatedAt){ OUT.settings=S.settings; flushSoon(); } // aún no existe en la nube: sube lo local
  }
  const next={}; const old=[]; const cutoff=Date.now()-30*86400000;
  for(const r of rows){ const it=cleanItem(r.data,r.id); if(!it) continue; next[it.id]=it; if(it.deleted&&it.updatedAt<cutoff) old.push(it.id); }
  for(const [id,it] of Object.entries(OUT.items)) next[id]=it;
  S.items=next; S.ready=true; S.lastSync=Date.now(); S.syncErr=null; persistSoon(); render();
  if(old.length) SB.client.from('items').delete().in('id',old.slice(0,200)).then(()=>{},()=>{});
}
function applyRemoteItem(r){
  if(!r||!r.id||OUT.items[r.id]) return;
  const it=cleanItem(r.data,r.id); if(!it) return;
  const cur=S.items[r.id];
  if(!cur||it.updatedAt>=cur.updatedAt){ S.items[r.id]=it; persistSoon(); render(); }
}
function subscribe(){
  if(S.mode!=='cloud'||!S.user) return;
  const gen=++SB.gen; clearTimeout(SB.retryT);
  if(SB.channel){ try{SB.client.removeChannel(SB.channel);}catch(e){} SB.channel=null; }
  const u=S.user.id;
  SB.channel=SB.client.channel('deures-'+u)
    .on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'user_id=eq.'+u},p=>{ if(gen===SB.gen) applyRemoteItem(p.new); })
    .on('postgres_changes',{event:'*',schema:'public',table:'settings',filter:'user_id=eq.'+u},p=>{
      if(gen!==SB.gen||OUT.settings||!p.new||!p.new.data) return;
      const st=cleanSettings(p.new.data); if(st.updatedAt>=(S.settings.updatedAt||0)){ S.settings=st; applySettingsLang(); persistSoon(); render(); }
    })
    .subscribe(status=>{
      if(gen!==SB.gen) return;
      if(status==='SUBSCRIBED'){ S.live=true; fetchAll().catch(()=>{}); flush(); }
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){ S.live=false; SB.retryT=setTimeout(()=>{ if(gen===SB.gen) subscribe(); },5000); }
      render();
    });
}
function startCloud(user){
  if(S.user&&S.user.id===user.id&&S.mode==='cloud') return;
  S.user=user; S.mode='cloud'; S.ready=false;
  loadSnap(LS.get(kCache())); OUT=LS.get(kOut())||{items:{},settings:null}; if(!OUT.items) OUT.items={};
  if(Object.keys(S.items).length||S.settings.updatedAt) S.ready=true;
  render();
  fetchAll().catch(e=>{ S.syncErr=(e&&e.message)||String(e); S.ready=true; render(); });
  setTimeout(()=>{ if(!S.ready){ S.ready=true; S.syncErr=S.syncErr||t('El servidor tarda en responder.'); render(); } },8000);
  subscribe(); flush();
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'Europe/Madrid';
  setTimeout(()=>{ if(S.mode==='cloud'&&(S.settings.tz!==tz||(!S.settings.lang))) saveSettings({tz,lang:S.settings.lang||LANG}); Push.refresh(); },1500);
}
function stopCloud(){
  SB.gen++; if(SB.channel){ try{SB.client.removeChannel(SB.channel);}catch(e){} SB.channel=null; }
  S.user=null; S.items={}; S.settings={...DEFAULT_SETTINGS}; OUT={items:{},settings:null}; S.live=false; S.ready=false;
}
function startLocal(){
  S.mode='local'; S.user=null; loadSnap(LS.get(K_LOCAL)); S.ready=true; render();
}
async function initStore(){
  if(!HAS_CLOUD||LS.get(K_MODE)==='local'){ startLocal(); return; }
  try{
    SB.client=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    SB.client.auth.onAuthStateChange((ev,session)=>{
      if(ev==='SIGNED_OUT'){ stopCloud(); S.mode='auth'; render(); return; }
      if(ev==='PASSWORD_RECOVERY'){ AUTH.recovery=true; S.mode='auth'; render(); return; }
      if(session&&session.user) setTimeout(()=>startCloud(session.user),0);
    });
    const res=await Promise.race([SB.client.auth.getSession(),new Promise(r=>setTimeout(()=>r({timeout:true}),8000))]);
    if(res.timeout){ if(S.mode==='boot'){ S.mode='auth'; AUTH.err=t('No se puede conectar con el servidor. Revisa la conexión y vuelve a abrir la app.'); render(); } return; }
    const data=res.data;
    if(res.error) S.syncErr=res.error.message;
    if(data&&data.session) startCloud(data.session.user);
    else if(S.mode==='boot'){ S.mode='auth'; render(); }
  }catch(e){ startLocal(); }
}
window.addEventListener('online',()=>{ if(S.mode==='cloud'){ flush(); fetchAll().catch(()=>{}); if(!S.live) subscribe(); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.mode==='cloud'){ fetchAll().catch(()=>{}); flush(); if(!S.live) subscribe(); } });

function localLeftovers(){
  if(S.mode!=='cloud'||!S.ready) return null;
  const loc=LS.get(K_LOCAL); if(!loc) return null;
  const n=Object.keys(loc.items||{}).length+((loc.settings&&loc.settings.subjects)||[]).length;
  return n?loc:null;
}
function importData(data,{merge=true}={}){
  if(!data||typeof data!=='object') throw new Error('bad');
  const st=cleanSettings(data.settings||{});
  if(merge){
    const subs=[...S.settings.subjects]; for(const s of st.subjects) if(!subs.find(x=>x.id===s.id||norm(x.name)===norm(s.name))) subs.push(s);
    const sch=[...S.settings.schedule]; for(const c of st.schedule) if(!sch.find(x=>x.id===c.id)) sch.push(c);
    saveSettings({subjects:subs,schedule:sch,name:S.settings.name||st.name,onboarded:true});
  } else saveSettings({...st,onboarded:true});
  let n=0; for(const [id,r] of Object.entries(data.items||{})){ const it=cleanItem(r,id); if(it&&!it.deleted&&!S.items[it.id]){ saveItem(it); n++; } }
  return n;
}

const isTask=it=>it.kind==='deber'||it.kind==='entrega';
const sortByDue=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||a.createdAt-b.createdAt;
const pendingTasks=()=>itemList().filter(it=>isTask(it)&&!it.done).sort(sortByDue);

const doneInWeek=ws=>itemList().filter(it=>isTask(it)&&it.done&&it.doneAt&&ymd(new Date(it.doneAt))>=ws&&ymd(new Date(it.doneAt))<=addDays(ws,6)).length;
function groupTasks(list){
  const td=today(), endW=addDays(weekStart(td),6), endNW=addDays(endW,7);
  const G=[[t('Vencidos'),[],'red'],[t('Hoy'),[]],[t('Mañana'),[]],[t('Esta semana'),[]],[t('Próxima semana'),[]],[t('Más adelante'),[]],[t('Sin fecha'),[]]];
  for(const it of list){
    if(!it.date) G[6][1].push(it);
    else if(it.date<td) G[0][1].push(it);
    else if(it.date===td) G[1][1].push(it);
    else if(it.date===addDays(td,1)) G[2][1].push(it);
    else if(it.date<=endW) G[3][1].push(it);
    else if(it.date<=endNW) G[4][1].push(it);
    else G[5][1].push(it);
  }
  return G.filter(g=>g[1].length);
}

const chip=(id,course)=>{const s=subj(id);return s?`<span class="chip" style="--c:${s.color}"><i></i><em>${esc(s.name)}</em></span>`:course?`<span class="chip" style="--c:#646D80" title="${esc(course)}"><i></i><em>${esc(course)}</em></span>`:'';};
const srcBadge=it=>it.source?`<span class="src ${it.source==='classroom'?'gc':'md'}">${sourceName(it.source)}</span>`:'';
const catChip=c=>`<span class="chip" style="--c:${CATS[c]||'#9AA3B5'}"><i></i><em>${esc(catName(c))}</em></span>`;
const stepsTxt=it=>it.steps.length?`${it.steps.filter(s=>s.done).length}/${it.steps.length} ${it.kind==='examen'?t('temas'):t('pasos')}`:'';
function dueLabel(it){
  if(!it.date) return `<span class="m">${t('Sin fecha')}</span>`;
  const over=!it.done&&it.date<today();
  return `<span class="m ${over?'over':''}">${ic('calendar','s14')}${relDay(it.date)}${it.time?' · '+it.time:''}</span>`;
}
function taskRow(it,opts={}){
  const sel=UI.view==='deberes'&&UI.sel===it.id&&!isMobile();
  return `<div class="task ${it.done?'done':''} ${sel?'sel':''}" data-act="open" data-id="${it.id}" role="button" tabindex="0">
    <button class="cb ${it.done?'on':''}" data-act="toggle" data-id="${it.id}" aria-label="${it.done?t('Marcar como pendiente'):t('Marcar como hecho')}">${it.done?ic('check','s14'):''}</button>
    <div class="t-body"><div class="t-title">${esc(it.title||t('(sin título)'))}</div>
      <div class="t-meta">${opts.kindTag||it.kind==='examen'?`<span class="kind ${it.kind}">${kindName(it.kind).toUpperCase()}</span>`:''}${chip(it.subjectId,it.course)}${dueLabel(it)}${srcBadge(it)}${it.steps.length?`<span class="m st">${ic('steps','s14')}${stepsTxt(it)}</span>`:''}</div></div>
    ${it.kind!=='personal'?`<span class="flag ${it.done?'':it.priority}" title="${t('Prioridad')}: ${prioName(it.priority)}">${ic('flag','s16')}</span>`:''}
  </div>`;
}
function examCard(e){
  const n=e.date?diffDays(e.date,today()):null;
  const cls=n===null?'':n<=3?'d':n<=7?'w':'';
  const big=n===null?`<b class="sm">—</b><small>${t('sin fecha')}</small>`:n===0?`<b class="sm">${t('HOY')}</b><small>${t('¡suerte!')}</small>`:`<b>${n}</b><small>${n===1?t('día'):t('días')}</small>`;
  const tot=e.steps.length, dn=e.steps.filter(s=>s.done).length;
  return `<div class="exam" data-act="open" data-id="${e.id}" role="button" tabindex="0">
    <div class="top"><div class="cd ${cls}">${big}</div><div class="info"><b>${esc(e.title||t('Examen'))}</b>${chip(e.subjectId,e.course)}</div></div>
    <div class="date">${ic('calendar','s14')}${e.date?cap1(fmtShort(e.date)):t('Sin fecha')}${e.time?' · '+e.time:''}</div>
    <div class="prog">${tot?`<div class="row"><span>${t('Repaso')}</span><span>${dn}/${tot} ${t('temas')}</span></div><div class="track ${dn===tot?'ok':''}"><i style="width:${Math.round(dn/tot*100)}%"></i></div>`:`<div class="row"><span class="muted">${t('Añade los temas para seguir tu repaso')}</span></div>`}</div>
  </div>`;
}
const headActs=(btnLabel,btnCls='')=>`<div class="acts"><label class="search">${ic('search','s16')}<input data-in="q" data-focus="q" placeholder="${t('Buscar…')}" value="${esc(UI.q)}"></label><button class="btn ${btnCls}" data-act="new">${ic('plus','s18')}${btnLabel}</button></div>`;
function greeting(){const h=new Date().getHours();return h<6?t('Buenas noches'):h<14?t('Buenos días'):h<21?t('Buenas tardes'):t('Buenas noches');}
function currentClass(){
  const dw=dowMon(today()), m=nowMin(); const cl=classesOn(dw);
  const now=cl.find(c=>toMin(c.start)<=m&&m<toMin(c.end)); const next=cl.find(c=>toMin(c.start)>m);
  return {now,next,list:cl};
}
const loading=()=>`<div class="empty-big" style="padding-top:120px">${ic('cloud')}<div><b>${t('Cargando tus datos…')}</b></div><button class="link" onclick="location.reload()">${t('¿Tarda mucho? Recargar')}</button></div>`;

/* ================= VISTA: HOY ================= */
function viewHoy(){
  const td=today(), pend=pendingTasks(), forToday=pend.filter(i=>i.date===td);
  const endW=addDays(weekStart(td),6), overdue=pend.filter(i=>i.date&&i.date<td).length;
  const ue=upcomingExams(), nx=ue[0], nxd=nx&&nx.date?diffDays(nx.date,td):null;
  const ws=weekStart(td), dw=doneInWeek(ws), dlw=doneInWeek(addDays(ws,-7)), dif=dw-dlw;
  const nextTime=forToday.find(i=>i.time&&i.time>=fromMin(nowMin()));
  const name=S.settings.name?`, ${esc(S.settings.name)}`:'';
  const soon=pend.filter(i=>i.date&&i.date<=addDays(td,7));
  const {now,next,list:cl}=currentClass();
  const persToday=onDate(td).filter(i=>i.kind==='personal');
  let h=`<div class="head"><div><h1>${greeting()}${name}</h1><p>${cap1(fmtLong(td))} · ${forToday.length?tn(forToday.length,'tienes {n} entrega hoy','tienes {n} entregas hoy'):t('nada que entregar hoy')}</p></div>${headActs(t('Nuevo deber'))}</div>`;
  if(S.ready&&!S.settings.onboarded&&!S.settings.subjects.length) h+=welcome();
  if(localLeftovers()) h+=`<div class="banner">${ic('device','s18')}<div class="grow">${t('Tienes datos guardados solo en este navegador. ¿Quieres subirlos a tu cuenta?')}</div><button class="btn sm" data-act="migrate">${t('Subirlos')}</button><button class="btn ghost sm" data-act="dismiss-migrate">${t('Ahora no')}</button></div>`;
  if(S.mode==='cloud'&&Push.supported&&Push.perm()==='default'&&S.settings.onboarded&&!LS.get('deures:pushask')) h+=`<div class="banner">${ic('bell','s18')}<div class="grow">${t('Activa los avisos en este dispositivo para que te recuerde entregas y exámenes aunque la app esté cerrada.')}</div><button class="btn sm" data-act="push-on">${t('Activar')}</button><button class="btn ghost sm" data-act="push-later">${t('Ahora no')}</button></div>`;
  h+=`<div class="stats">
    <button class="stat" data-act="go" data-v="deberes"><span>${t('Pendientes')}</span><b>${pend.length}</b><small>${overdue?tn(overdue,'{n} vencido','{n} vencidos'):t('{n} vencen esta semana',{n:pend.filter(i=>i.date&&i.date<=endW).length})}</small></button>
    <button class="stat" data-act="go" data-v="deberes"><span>${t('Para hoy')}</span><b style="color:${forToday.length?'var(--warning)':''}">${forToday.length}</b><small>${nextTime?t('La próxima a las {h}',{h:nextTime.time}):forToday.length?t('Sin hora concreta'):t('Día libre de entregas')}</small></button>
    <button class="stat" data-act="go" data-v="examenes"><span>${t('Próximo examen')}</span><b style="color:${nxd!==null&&nxd<=3?'var(--danger)':''}">${nx?(nxd===null?'—':nxd===0?t('Hoy'):nxd===1?t('Mañana'):nxd+(isMobile()?t('d'):' '+t('días'))):'—'}</b><small>${nx?esc(nx.title):t('Ninguno a la vista')}</small></button>
    <button class="stat hide-m" data-act="go" data-v="deberes"><span>${t('Hechas esta semana')}</span><b>${dw}</b><small>${dif>0?t('+{n} que la semana pasada',{n:dif}):dif<0?t('{n} que la semana pasada',{n:dif}):t('Igual que la semana pasada')}</small></button>
  </div>`;
  if(cl.length&&(now||next)){
    const c=now||next, s=subj(c.subjectId);
    const pct=now?clamp((nowMin()-toMin(now.start))/(toMin(now.end)-toMin(now.start)),0,1):0;
    h+=`<div class="card mob-now" style="background:var(--accent-soft);border-color:transparent;gap:8px" data-act="go" data-v="horario"><div class="card-h"><span class="cap" style="color:var(--accent)">${now?t('Ahora en clase'):t('Siguiente clase')}</span><small class="sec">${now?t('hasta las {h}',{h:now.end}):t('a las {h}',{h:next.start})}</small></div><b style="font-size:17px">${esc(s?s.name:t('Clase'))}</b><small class="sec">${esc(c.room||'')}${now&&next?' · '+t('luego {s} a las {h}',{s:esc((subj(next.subjectId)||{}).name||t('clase')),h:next.start}):''}</small>${now?`<div class="track" style="height:4px;background:var(--bg-hover)"><i style="width:${pct*100}%"></i></div>`:''}</div>`;
  }
  let Lh=`<div class="card-h"><h3 style="font-size:16px">${t('Para entregar pronto')}</h3><a class="link" href="#deberes">${t('Ver todos')} →</a></div>`;
  if(!soon.length) Lh+=`<div class="card" style="align-items:center;text-align:center;padding:32px">${ic('check','s24')}<div><b>${t('Todo al día')}</b><p class="muted" style="margin-top:4px">${t('No tienes entregas en los próximos 7 días.')}</p></div><button class="btn ghost sm" data-act="new">${ic('plus','s16')}${t('Añadir deber')}</button></div>`;
  else for(const [g,list,c] of groupTasks(soon)) Lh+=`<div class="group"><div class="cap ${c||''}">${g}${c?' · '+list.length:''}</div>${list.map(i=>taskRow(i)).join('')}</div>`;
  let R=`<div class="card cls-card"><div class="card-h"><h3>${t('Clases de hoy')}</h3><small class="muted">${cl.length?cl[0].start+' – '+cl[cl.length-1].end:''}</small></div>`;
  R+=cl.length?cl.map(c=>{const s=subj(c.subjectId),on=now&&now.id===c.id;return `<div class="cls ${on?'now':''}" style="--c:${s?s.color:'#9AA3B5'}"><div class="tm"><b>${c.start}</b><small>${c.end}</small></div><div class="bar"></div><div class="inf"><b>${esc(s?s.name:t('Clase'))}${on?`<span class="now-b">${t('AHORA')}</span>`:''}</b><small>${esc(c.room||'')}</small></div></div>`;}).join(''):`<div class="empty">${S.settings.schedule.length?t('Hoy no tienes clase.'):`${t('Aún no has puesto tu horario.')} <a class="link" href="#horario">${t('Añadirlo')}</a>`}</div>`;
  R+='</div>';
  R+=`<div class="card-h" style="padding-top:2px"><h3 style="font-size:15px">${t('Próximo examen')}</h3>${ue.length>1?`<small class="muted">${t('{n} más después',{n:ue.length-1})}</small>`:''}</div>`;
  R+=nx?examCard(nx):`<div class="card"><div class="empty">${t('No hay exámenes a la vista.')} <a class="link" href="#examenes">${t('Añadir uno')}</a></div></div>`;
  R+=`<div class="card" style="gap:10px"><div class="row"><span style="color:var(--personal);display:flex">${ic('user','s16')}</span><h3>${t('Personal hoy')}</h3></div>${persToday.length?persToday.map(p=>`<div class="pers-row" data-act="open" data-id="${p.id}" role="button" style="cursor:pointer"><i style="background:${CATS[p.category]||PERSONAL_COLOR}"></i><small>${p.time||t('Todo el día')}</small>${esc(p.title)}</div>`).join(''):`<div class="empty">${t('Nada planeado.')} <a class="link" href="#personal">${t('Ver mi calendario')}</a></div>`}</div>`;
  h+=`<div class="cols"><div class="group" style="gap:10px">${Lh}</div><div class="side">${R}</div></div>`;
  return h;
}

/* ================= VISTA: DEBERES ================= */
function viewDeberes(){
  const q=norm(UI.q);
  let pool=itemList().filter(it=>q?it.kind!=='personal':isTask(it));
  if(UI.subjF!=='all') pool=pool.filter(i=>i.subjectId===UI.subjF);
  if(q) pool=pool.filter(i=>norm(i.title+' '+i.notes+' '+(subj(i.subjectId)||{}).name).includes(q));
  const pend=pool.filter(i=>!i.done).sort(sortByDue), done=pool.filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const allP=pendingTasks().length, allD=itemList().filter(i=>isTask(i)&&i.done).length;
  const FL={pendientes:t('Pendientes'),todos:t('Todos'),hechos:t('Hechos')};
  let h=`<div class="head"><div><h1>${q?t('Resultados'):t('Deberes')}</h1><p>${q?t('{n} resultados para “{q}”',{n:pend.length+done.length,q:esc(UI.q)}):t('{n} pendientes · {m} hechos',{n:allP,m:allD})}</p></div>${headActs(t('Nuevo deber'))}</div>`;
  const subs=S.settings.subjects;
  h+=`<div class="toolbar"><div class="seg box">${Object.keys(FL).map(f=>`<button class="${UI.dFilter===f?'on':''}" data-act="dfilter" data-v="${f}">${FL[f]}</button>`).join('')}</div>
    <div class="filters"><button class="pill-f ${UI.subjF==='all'?'on':''}" data-act="subjf" data-v="all">${t('Todas')}</button>${subs.map(s=>`<button class="chip ${UI.subjF===s.id?'on':''}" style="--c:${s.color}" data-act="subjf" data-v="${s.id}"><i></i><em>${esc(s.name)}</em></button>`).join('')}</div>
    <span class="sec sort" style="font-size:13px">${t('Ordenado por fecha de entrega')}</span></div>`;
  let Lh='';
  if(UI.dFilter!=='hechos') for(const [g,list,c] of groupTasks(pend)) Lh+=`<div class="group"><div class="cap ${c||''}">${g}${c?' · '+list.length:''}</div>${list.map(i=>taskRow(i,{kindTag:!!q})).join('')}</div>`;
  if(UI.dFilter!=='pendientes'&&done.length) Lh+=`<div class="group"><div class="cap">${t('Hechos')} · ${done.length}</div>${done.slice(0,80).map(i=>taskRow(i,{kindTag:!!q})).join('')}</div>`;
  if(!Lh) Lh=`<div class="empty-big">${ic(UI.dFilter==='hechos'?'tasks':'check')}<div><b>${q?t('Sin resultados'):UI.dFilter==='hechos'?t('Aún no has completado nada'):t('¡Nada pendiente!')}</b><p class="muted" style="margin-top:4px">${q?t('Prueba con otra palabra.'):t('Añade un deber con el botón “Nuevo deber”.')}</p></div></div>`;
  const sel=UI.sel&&S.items[UI.sel]&&!S.items[UI.sel].deleted&&S.items[UI.sel];
  const D=sel?`<div class="detail">${detailHTML(sel)}</div>`:`<div class="detail" style="align-items:center;justify-content:center;text-align:center;min-height:320px;color:var(--text-3)">${ic('tasks')}<p>${t('Selecciona un deber para ver sus pasos y notas')}</p></div>`;
  h+=`<div class="split"><div class="list">${Lh}</div><div class="detail-col">${D}</div></div>`;
  return h;
}

/* ================= DETALLE ================= */
function detailHTML(it){
  const per=it.kind==='personal';
  const tot=it.steps.length, dn=it.steps.filter(s=>s.done).length;
  const past=it.kind==='examen'&&it.date&&it.date<=today();
  const rd=it.date?relDay(it.date):'';
  let h=`<div class="card-h"><span class="kind ${it.kind}">${kindName(it.kind).toUpperCase()}</span><button class="link" data-act="edit" data-id="${it.id}">${t('Editar')}</button></div>
  <h2>${esc(it.title||t('(sin título)'))}</h2>
  <div class="row" style="flex-wrap:wrap">${per?catChip(it.category):chip(it.subjectId,it.course)||`<span class="muted" style="font-size:12px">${t('Sin asignatura')}</span>`}${srcBadge(it)}</div>
  ${it.link?`<a class="link" href="${esc(it.link)}" target="_blank" rel="noopener">${t('Abrir en {s}',{s:sourceName(it.source)||'web'})} ↗</a>`:''}
  <div class="prop"><span>${it.kind==='examen'?t('Fecha'):per?t('Cuándo'):t('Entrega')}</span><span class="row">${ic('calendar','s14')}${it.date?`${rd}${[t('Hoy'),t('Mañana'),t('Ayer')].includes(rd)?', '+fmtShort(it.date).toLowerCase():''}`:t('Sin fecha')}${it.time?' · '+it.time:''}</span></div>`;
  if(per&&it.place) h+=`<div class="prop"><span>${t('Lugar')}</span><span class="row">${ic('pin','s14')}${esc(it.place)}</span></div>`;
  if(!per){
    h+=`<div class="prop"><span>${t('Prioridad')}</span><div class="seg">${Object.keys(PRIOS).map(p=>`<button class="${it.priority===p?'on '+p:''}" data-act="set-prio" data-id="${it.id}" data-v="${p}">${prioName(p)}</button>`).join('')}</div></div>
    <div class="prop"><span>${t('Tipo')}</span><div class="seg">${['deber','entrega','examen'].map(k=>`<button class="${it.kind===k?'on acc':''}" data-act="set-kind" data-id="${it.id}" data-v="${k}">${kindName(k)}</button>`).join('')}</div></div>`;
  }
  if(past) h+=`<div class="prop"><span>${t('Nota')}</span><input type="text" inputmode="decimal" style="width:90px;padding:6px 10px" data-in="grade" data-id="${it.id}" data-focus="grade-${it.id}" value="${it.grade===null?'':String(it.grade).replace('.',LANG==='en'?'.':',')}" placeholder="—"><small class="muted">${t('sobre 10')}</small></div>`;
  h+=`<div class="field"><span class="lbl">${t('Notas')}</span><textarea class="notes" data-in="notes" data-id="${it.id}" data-focus="notes-${it.id}" placeholder="${t('Apuntes, enlaces, lo que necesites…')}">${esc(it.notes)}</textarea></div>`;
  if(!per){
    h+=`<div class="card-h"><span class="lbl">${it.kind==='examen'?t('Temas a repasar'):t('Pasos')}</span><small class="muted">${tot?t('{n} de {m}',{n:dn,m:tot}):''}</small></div>`;
    if(tot) h+=`<div class="track ok"><i style="width:${Math.round(dn/tot*100)}%"></i></div>`;
    h+=`<div class="steps">${it.steps.map(s=>`<div class="step ${s.done?'done':''}"><button class="cb sm ${s.done?'on':''}" data-act="step" data-id="${it.id}" data-s="${s.id}">${s.done?ic('check','s14'):''}</button><span>${esc(s.text)}</span><button class="x" data-act="step-del" data-id="${it.id}" data-s="${s.id}" aria-label="${t('Quitar')}">${ic('x','s14')}</button></div>`).join('')}
      <label class="add-step">${ic('plus','s16')}<input data-in="step-new" data-id="${it.id}" data-focus="step-new-${it.id}" placeholder="${it.kind==='examen'?t('Añadir tema (Enter)'):t('Añadir paso (Enter)')}"></label></div>`;
  }
  h+=`<div class="d-acts">${per?'':`<button class="btn" data-act="toggle" data-id="${it.id}">${ic('check','s18')}${it.done?t('Marcar como pendiente'):t('Marcar como hecho')}</button>`}<button class="btn danger" data-act="del" data-id="${it.id}">${t('Eliminar')}</button></div>`;
  return h;
}

/* ================= VISTA: EXÁMENES ================= */
function viewExamenes(){
  const up=upcomingExams(), past=pastExams(), n=up[0]&&up[0].date?diffDays(up[0].date,today()):null;
  let h=`<div class="head"><div><h1>${t('Exámenes')}</h1><p>${up.length?tn(up.length,'{n} próximo','{n} próximos')+' · '+t('el siguiente {d}',{d:inDays(n)}):t('Sin exámenes a la vista')}</p></div><div class="acts"><button class="btn" data-act="new">${ic('plus','s18')}${t('Nuevo examen')}</button></div></div>`;
  h+=`<div class="cap">${t('Próximos')}</div>`;
  h+=up.length?`<div class="grid-ex">${up.map(examCard).join('')}</div>`:`<div class="empty-big">${ic('exam')}<div><b>${t('Ningún examen pendiente')}</b><p class="muted" style="margin-top:4px">${t('Cuando te pongan fecha, añádelo y verás la cuenta atrás.')}</p></div><button class="btn ghost sm" data-act="new">${ic('plus','s16')}${t('Añadir examen')}</button></div>`;
  if(past.length){
    const dec=g=>String(g).replace('.',LANG==='en'?'.':',');
    h+=`<div class="cap">${t('Pasados')}</div><div class="past">${past.map(e=>{const g=e.grade;const gc=g===null?'':g>=7?'ok':g>=5?'mid':'bad';return `<button data-act="open" data-id="${e.id}"><span style="color:var(--text-3);display:flex">${ic('exam','s18')}</span><span class="t">${esc(e.title)}</span>${chip(e.subjectId)}<span class="d">${cap1(fmtShort(e.date))}</span><span class="grade ${gc}">${g===null?'—':dec(g)}</span></button>`;}).join('')}</div>`;
    const graded=past.filter(e=>e.grade!==null); if(graded.length) h+=`<p class="muted" style="font-size:13px">${t('Media de notas')}: <b style="color:var(--text)">${dec((graded.reduce((a,e)=>a+e.grade,0)/graded.length).toFixed(2))}</b> (${tn(graded.length,'{n} examen','{n} exámenes')})</p>`;
  }
  return h;
}

/* ================= VISTA: CALENDARIO ================= */
function monthGrid(ym){ const [y,m]=ym.split('-').map(Number); const start=weekStart(ymd(new Date(y,m-1,1))); return Array.from({length:42},(_,i)=>addDays(start,i)); }
const shiftMonth=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${p2(d.getMonth()+1)}`;};
function viewCalendario(){
  const ym=UI.calMonth, [y,m]=ym.split('-').map(Number), sp=S.settings.showPersonal, td=today();
  const inM=itemList().filter(i=>i.date&&i.date.startsWith(ym));
  const nT=inM.filter(isTask).length, nE=inM.filter(i=>i.kind==='examen').length;
  let h=`<div class="head cal-head"><div><h1>${monthName(m-1)} ${y}</h1><p>${tn(nT,'{n} entrega','{n} entregas')} ${t('y')} ${tn(nE,'{n} examen','{n} exámenes')} ${t('este mes')}</p></div><div class="acts"><button class="switch ${sp?'on':''}" data-act="toggle-pers"><i></i><span>${t('Mostrar personal')}</span></button><div class="mnav"><button data-act="cal-m" data-v="-1" aria-label="${t('Mes anterior')}">${ic('left','s18')}</button><button class="t" data-act="cal-today">${t('Hoy')}</button><button data-act="cal-m" data-v="1" aria-label="${t('Mes siguiente')}">${ic('right','s18')}</button></div></div></div>`;
  h+=`<div class="legend"><span style="--c:var(--accent)"><i></i>${t('Deberes y entregas (color de la asignatura)')}</span><span style="--c:var(--danger)"><i></i>${t('Exámenes')}</span>${sp?`<span style="--c:var(--personal)"><i></i>${t('Personal')}</span>`:''}</div>`;
  const days=monthGrid(ym);
  let g=`<div class="month"><div class="wd">${L().wds.map(d=>`<span class="cap">${d}</span>`).join('')}</div>`;
  for(let w=0;w<6;w++){
    g+='<div class="wk">';
    for(let k=0;k<7;k++){
      const d=days[w*7+k], evs=onDate(d,sp), out=!d.startsWith(ym);
      g+=`<div class="day ${out?'out':''} ${d===td?'today':''} ${d===UI.calSel?'sel':''}" data-act="cal-sel" data-d="${d}"><span class="n">${parseD(d).getDate()}</span>
        ${evs.slice(0,3).map(e=>`<span class="ev ${e.done?'done':''}" style="--c:${itemColor(e)}"><span>${e.kind==='examen'?t('Examen')+': ':''}${esc(e.title)}</span></span>`).join('')}${evs.length>3?`<span class="more">${t('+{n} más',{n:evs.length-3})}</span>`:''}
        <span class="dots">${evs.slice(0,3).map(e=>`<i style="--c:${itemColor(e)}"></i>`).join('')}</span></div>`;
    }
    g+='</div>';
  }
  g+='</div>';
  const sel=UI.calSel, list=onDate(sel,sp);
  const cnt={t:list.filter(isTask).length,e:list.filter(i=>i.kind==='examen').length,p:list.filter(i=>i.kind==='personal').length};
  const parts=[cnt.e&&tn(cnt.e,'{n} examen','{n} exámenes'),cnt.t&&tn(cnt.t,'{n} entrega','{n} entregas'),cnt.p&&t('{n} personal',{n:cnt.p})].filter(Boolean);
  const cls=classesOn(dowMon(sel));
  let p=`<div class="daypanel"><div><h3>${cap1(fmtLong(sel))}</h3><p class="muted" style="font-size:13px;margin-top:4px">${parts.length?parts.join(' · '):t('Nada apuntado')}${cls.length?' · '+tn(cls.length,'{n} clase','{n} clases'):''}</p></div>`;
  p+=list.map(i=>`<button class="dp-item ${i.done?'done':''}" style="--c:${itemColor(i)}" data-act="open" data-id="${i.id}"><span class="bar"></span><span class="grow"><b>${esc(i.title)}</b><small>${kindName(i.kind)}${i.time?' · '+i.time:''}${i.kind==='personal'?(i.place?' · '+esc(i.place):''):(subj(i.subjectId)?' · '+esc(subj(i.subjectId).name):'')}</small></span></button>`).join('');
  p+=`<button class="add-day" data-act="new-on" data-d="${sel}">+ ${t('Añadir a este día')}</button></div>`;
  return h+`<div class="cal-wrap">${g}${p}</div>`;
}

/* ================= VISTA: HORARIO ================= */
function viewHorario(){
  const sch=S.settings.schedule, td=dowMon(today());
  let h=`<div class="head"><div><h1>${t('Horario')}</h1><p>${sch.length?t('{n} clases a la semana · toca un hueco para añadir',{n:sch.length}):t('Pon tu horario de clase')}</p></div><div class="acts"><button class="btn" data-act="new-class">${ic('plus','s18')}${t('Añadir clase')}</button></div></div>`;
  if(!sch.length) return h+`<div class="empty-big">${ic('clock')}<div><b>${t('Aún no has añadido tu horario')}</b><p class="muted" style="margin-top:4px">${t('Añade cada clase (día, hora, asignatura y aula) y en “Hoy” verás qué te toca.')}</p></div><button class="btn" data-act="new-class">${ic('plus','s16')}${t('Añadir la primera clase')}</button></div>`;
  const nd=sch.some(c=>c.day>=5)?(sch.some(c=>c.day===6)?7:6):5;
  let minM=Math.min(...sch.map(c=>toMin(c.start))), maxM=Math.max(...sch.map(c=>toMin(c.end)));
  minM=Math.floor(minM/60)*60; maxM=Math.ceil(maxM/30)*30; const HH=90, px=m=>(m-minM)/60*HH, H=px(maxM)+12;
  let w=`<div class="week week-desk" style="--nd:${nd}"><div class="hdr"><span></span>${L().wd.slice(0,nd).map((d,i)=>`<span class="${i===td?'today':''}">${d}${i===td?' · '+t('hoy'):''}</span>`).join('')}</div><div class="body" style="height:${H}px"><div class="hours">`;
  for(let m=minM;m<=maxM;m+=60) w+=`<span style="top:${px(m)}px">${fromMin(m)}</span>`;
  w+='</div>';
  for(let d=0;d<nd;d++){
    w+=`<div class="col" data-act="slot" data-day="${d}" data-min="${minM}" data-hh="${HH}">`;
    for(const c of classesOn(d)){ const s=subj(c.subjectId); const top=px(toMin(c.start))+3, hh=px(toMin(c.end))-px(toMin(c.start))-6;
      w+=`<button class="blk" style="top:${top}px;height:${hh}px;--c:${s?s.color:'#9AA3B5'}" data-act="edit-class" data-id="${c.id}"><b>${esc(s?s.name:t('Clase'))}</b><small>${c.start} – ${c.end}</small>${c.room?`<small class="r">${esc(c.room)}</small>`:''}</button>`; }
    if(d===td){ const nm=nowMin(); if(nm>=minM&&nm<=maxM) w+=`<div class="nowline" style="top:${px(nm)}px;left:0;right:0"></div>`; }
    w+='</div>';
  }
  for(let m=minM;m<=maxM;m+=30) w+=`<div class="line ${m%60?'half':''}" style="top:${px(m)}px"></div>`;
  w+='</div></div>';
  const sd=UI.schedDay, list=classesOn(sd), dayName=L().wd[sd].toLowerCase();
  let mob=`<div class="week-mob"><div class="seg full">${L().wd1.slice(0,nd).map((d,i)=>`<button class="${sd===i?'on':''}" data-act="sched-day" data-v="${i}">${d}${i===td?' ·':''}</button>`).join('')}</div>`;
  mob+=`<div style="display:flex;flex-direction:column;gap:8px">${list.length?list.map(c=>{const s=subj(c.subjectId);return `<button class="dp-item" style="--c:${s?s.color:'#9AA3B5'}" data-act="edit-class" data-id="${c.id}"><span class="bar"></span><span class="grow"><b>${esc(s?s.name:t('Clase'))}</b><small>${c.start} – ${c.end}${c.room?' · '+esc(c.room):''}</small></span></button>`;}).join(''):`<div class="empty">${t('Sin clases el {d}.',{d:dayName})}</div>`}<button class="add-day" data-act="new-class" data-day="${sd}">+ ${t('Añadir clase el {d}',{d:dayName})}</button></div></div>`;
  return h+w+mob;
}

/* ================= MODALES ================= */
let MODAL=null;
function openModal(m){ MODAL=m; renderModal(); }
function closeModal(){ MODAL=null; const el=$('#modal'); el.classList.remove('open'); el.innerHTML=''; }
function renderModal(){
  const el=$('#modal'); if(!MODAL){closeModal();return;}
  const keep=captureFocus(el);
  let body='';
  if(MODAL.type==='editor') body=editorHTML(MODAL);
  else if(MODAL.type==='class') body=classHTML(MODAL);
  else if(MODAL.type==='detail'){ const it=S.items[MODAL.id]; if(!it||it.deleted){closeModal();return;} body=detailHTML(it); }
  else if(MODAL.type==='more') body=moreHTML();
  el.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${body}</div>`;
  el.classList.add('open');
  restoreFocus(el,keep);
  if(MODAL.autofocus){ const f=el.querySelector('[data-autofocus]'); if(f&&!isMobile()) f.focus(); MODAL.autofocus=false; }
}

function nextWeekday(){ const td=today(), dw=dowMon(td); const target=dw<4?4:0; const n=((target-dw)+7)%7||7; return [L().wd[target],addDays(td,n)]; }

  const quick=[[t('Hoy'),td],[t('Mañana'),addDays(td,1)],[nwl,nwd]];
  const subs=S.settings.subjects;
  return `<div class="sheet-h"><h2>${e.id?t('Editar'):t('Nuevo')}</h2><button class="sec" data-act="close">${t('Cancelar')}</button></div>

/* ================= TOAST ================= */
function toast(msg,undo){
  const box=$('#toast'); const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>${t('Deshacer')}</button>`:''}`;
  if(undo) el.querySelector('button').onclick=()=>{undo();el.remove();};
  box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(),undo?6000:2600);
}

async function syncCall(op,body){
  const {data}=await SB.client.auth.getSession(); const tok=data&&data.session&&data.session.access_token;
  const r=await fetch(SYNC_URL(op),{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body||{})});

function authErr(e){
  const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login')) return t('Correo o contraseña incorrectos.');
  if(m.includes('email not confirmed')) return t('Tienes que confirmar tu correo: abre el enlace que te hemos enviado.');
  if(m.includes('already registered')||m.includes('already been registered')) return t('Ya existe una cuenta con ese correo. Entra con ella.');
  if(m.includes('password')&&m.includes('6')) return t('La contraseña necesita al menos 6 caracteres.');
  if(m.includes('fetch')||m.includes('network')) return t('Sin conexión. Inténtalo de nuevo.');
  return (e&&e.message)||t('Algo ha fallado. Inténtalo de nuevo.');
}
const siteUrl=()=>location.origin+location.pathname;
async function authGo(){
  const a=AUTH; a.err=''; a.msg='';
  const email=a.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){ a.err=t('Escribe un correo válido.'); return render(); }
  if(a.pass.length<6){ a.err=t('La contraseña necesita al menos 6 caracteres.'); return render(); }
  if(a.mode==='signup'&&a.pass!==a.pass2){ a.err=t('Las contraseñas no coinciden.'); return render(); }
  a.busy=true; render();
  try{
    if(a.mode==='signup'){
      const {data,error}=await SB.client.auth.signUp({email,password:a.pass,options:{emailRedirectTo:siteUrl()}});
      if(error) throw error;
      if(!data.session){ a.mode='login'; a.msg=t('Cuenta creada. Te hemos enviado un correo: abre el enlace para confirmarla y luego entra aquí.'); }
    } else {
      const {error}=await SB.client.auth.signInWithPassword({email,password:a.pass});
      if(error) throw error;
    }
    a.pass=''; a.pass2='';
  }catch(e){ a.err=authErr(e); }
  a.busy=false; render();
}

/* ================= NOTIFICACIONES PUSH ================= */
const FN_URL=()=>CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/deures-push';
const Push={
  supported:('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window),
  sub:null, busy:false, msg:'', err:false,
  perm(){ return this.supported?Notification.permission:'unsupported'; },
  async reg(){
    const r=await navigator.serviceWorker.getRegistration(); if(r&&r.active) return r;
    return Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error(t('La app aún se está instalando. Espera unos segundos y vuelve a intentarlo.'))),6000))]);
  },
  async current(){ if(!this.supported) return null; try{ const r=await navigator.serviceWorker.getRegistration(); this.sub=r?await r.pushManager.getSubscription():null; }catch(e){ this.sub=null; } return this.sub; },
  async vapidKey(){
    const cached=LS.get('deures:vapid'); if(cached) return cached;
    const r=await fetch(FN_URL()+'?op=key',{headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+CFG.supabaseKey}});
    if(!r.ok) throw new Error('key '+r.status); const j=await r.json(); if(!j.publicKey) throw new Error('no key');
    LS.set('deures:vapid',j.publicKey); return j.publicKey;
  },
  async save(sub){
    const j=sub.toJSON();
    const {error}=await SB.client.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:S.user.id,p256dh:j.keys.p256dh,auth:j.keys.auth,device:deviceName(),lang:LANG,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Madrid',updated_at:new Date().toISOString()});
    if(error) throw error;
  },
  async enable(){
    if(this.busy) return; this.busy=true; this.msg=''; this.err=false; render();
    try{
      if(S.mode!=='cloud') throw new Error(t('Necesitas entrar con tu cuenta para recibir avisos.'));
      const p=await Notification.requestPermission();
      if(p!=='granted') throw new Error(t('Has bloqueado las notificaciones. Actívalas en los ajustes del navegador para esta web.'));
      const key=await this.vapidKey(); const r=await this.reg();
      let sub=await r.pushManager.getSubscription();
      if(sub&&sub.options&&sub.options.applicationServerKey){ const cur=b64u(new Uint8Array(sub.options.applicationServerKey)); if(cur!==key){ await sub.unsubscribe(); sub=null; } }
      if(!sub) sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:fromB64u(key)});
      await this.save(sub); this.sub=sub;
      if(!S.settings.notif.on) saveSettings({notif:{...S.settings.notif,on:true}});
      this.msg=t('Avisos activados en este dispositivo.');
    }catch(e){ this.err=true; this.msg=(e&&e.message)||t('No se han podido activar los avisos.'); }
    this.busy=false; render();
  },
  async disable(){

    this.busy=false; render();
  },
  async test(){

      const {data}=await SB.client.auth.getSession(); const tok=data&&data.session&&data.session.access_token;
      const r=await fetch(FN_URL()+'?op=test',{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({lang:LANG})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      this.err=!j.sent; this.msg=j.sent?t('Enviada. Debería llegarte en unos segundos.'):t('No hay dispositivos con avisos activados.');
    }catch(e){ this.err=true; this.msg=t('No se ha podido enviar la prueba.')+' '+((e&&e.message)||''); }
    this.busy=false; render();
  },
  async refresh(){ // al abrir: mantiene la suscripción al día (idioma, zona horaria)
    if(!this.supported||S.mode!=='cloud'||Notification.permission!=='granted') { render(); return; }

  }
};
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromB64u(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
function deviceName(){
  const u=navigator.userAgent; const os=/Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iOS':/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':/Linux/i.test(u)?'Linux':'?';
  const br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'';
  return `${os} · ${br}`.trim();
}

function captureFocus(root){
  const a=document.activeElement; if(!a||!root.contains(a)||!a.dataset||!a.dataset.focus) return null;

function restoreFocus(root,k){

}

  if((ev.key==='Enter'||ev.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.act){ ev.preventDefault(); el.click(); return; }
  if(ev.key==='n'&&!MODAL&&!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){ ev.preventDefault(); newByView(); }
});
